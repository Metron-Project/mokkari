name: Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # pyright needs the redis extra to check mokkari.redis_rate_limit.
      - name: Install project
        run: uv sync --python 3.13 --no-default-groups --group lint --all-extras
      - name: Install npm packages
        run: npm ci
      - name: Lint
        run: ./bin/lint-backend.sh
        env:
          # Keep uv run from re-syncing the default dependency groups.
          UV_NO_SYNC: "1"
  tox:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os:
          - ubuntu-latest
          # macOS runners are frequently unavailable; disabled to unblock CI.
          # - macos-latest
          # - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      # ----------------------------------------------
      #       check-out repo and set-up python
      # ----------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install unrar
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get -y install unrar
          else
            echo "$RUNNER_OS not supported"
          fi
        shell: bash
      - name: Install project
        run: uv sync --group test
      - name: Run tests
        run: uv run pytest
